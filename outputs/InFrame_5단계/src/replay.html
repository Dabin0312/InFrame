<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>InFrame · 학생 정책 주행 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101921;color:#ecf2eb;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:1120px;padding:28px clamp(12px,3vw,35px) 44px;margin:auto}h1{margin:3px 0 6px;letter-spacing:-.065em;font-size:clamp(30px,4vw,44px)}h2{font-size:21px;letter-spacing:-.04em;margin:0}p{margin:6px 0;color:#bbcad2}.toolbar,.ctr,.hd,.choices,.totals{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.totals{margin:18px 0;gap:8px 24px;color:#c2d3dc}.choices{margin-bottom:10px}.toolbar{margin-bottom:16px}button,select{font:inherit;font-size:14px;background:#1c2e3a;color:#ebf3f3;border:1px solid #516776;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover,select:hover{border-color:#a6e4cd}button[aria-pressed=true],#play{background:#a1e3ca;color:#0d221d;border-color:transparent}label{font-size:14px;color:#c4d0d6}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#192935;border:1px solid #354956;border-radius:13px;overflow:hidden}.hd{padding:10px 13px;justify-content:space-between}.rgb{width:100%;display:block;aspect-ratio:4/3;background:#0e1721;object-fit:contain}.metrics{padding:8px 12px;color:#c8d8df;font-size:14px}.bad{color:#ffb095}.good{color:#a4e8c9}.ctr{margin:15px 0}.ctr input{flex:1;min-width:100px;accent-color:#9edfc5}.below{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:20px;align-items:center}.map{width:100%;max-height:340px;object-fit:contain;background:#101b24;border-radius:10px}.legend{font-size:14px}.mint{color:#8af0cf}.purple{color:#c5adff}a{color:#bde9df}.small{font-size:12px}.legend p{margin:8px 0}.foot{font-size:13px;color:#91a6b5;margin-top:15px}@media(max-width:650px){main{padding:14px 10px}.compare{gap:5px}.hd{padding:7px;display:block}h2{font-size:17px}.metrics{padding:5px;font-size:12px}.below{grid-template-columns:1fr}.map{max-height:240px}.ctr{gap:5px}.hd b{font-size:13px}}</style>
<main><h1>학생 정책 주행 비교</h1><p>두 학생이 같은 자리에서 ‘소화기’라는 목표를 받고 출발한다. 시간 막대를 움직이면 같은 시각의 카메라와 경로가 함께 바뀐다.</p>
<div class="totals" id="totals"></div><div class="choices" id="choices"></div><div class="toolbar"><label for="starts">검증 출발점</label><select id="starts"></select><span id="totaldist"></span></div>
<div class="compare" id="compare"></div><div class="ctr"><button id="play">재생</button><button id="prev" aria-label="이전 스텝">−1</button><button id="next" aria-label="다음 스텝">+1</button><input type="range" id="time" min="0" value="0" aria-label="주행 시각"><button id="end">두 주행 종료 시점</button><select id="speed" aria-label="재생 속도"><option value="1">1배속</option><option value="4">4배속</option><option value="8" selected>8배속</option></select></div>
<div class="below"><canvas id="map" class="map" width="560" height="560"></canvas><div class="legend"><h2>실제 이동 경로</h2><p><b class="mint">● 한 프레임</b>　<b class="purple">● 최근 4스텝</b></p><p>주황색 C는 소화기, 흰 원은 등록 관측점이다. 먼저 끝난 주행은 마지막 사진과 위치를 유지한다.</p><div id="links"></div></div></div><p class="foot">Skokloster 성 · 성공은 명시적 STOP, 관측점까지 0.8 m 이내, 같은 소화기의 마지막 화면 가시성을 함께 검사한 자동 판정이다.</p></main>
<script src="viewer/index.js"></script><script>
const $=id=>document.getElementById(id), names=['한 프레임','최근 4스텝'],colors=['#86ebca','#c5aaff'],traces=window.traces={};
const reason={success:'성공',timeout:'시간 초과',collision_limit:'충돌 3회',stopped_too_far:'너무 이른 정지',goal_out_of_view:'목표가 시야 밖'};
const types={all:'전체',both:'둘 다 성공',one_only:'한 프레임만 성공',four_only:'4스텝만 성공',neither:'둘 다 실패'};
function group(p){return p[0].success?(p[1].success?'both':'one_only'):(p[1].success?'four_only':'neither')}
const dirs=(r)=>'episodes/h'+r.history+'/'+r.start_id+'/';
const imgCache=new Map();function image(url){if(!imgCache.has(url)){imgCache.set(url,new Promise((ok,no)=>{let im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=url}));if(imgCache.size>48)imgCache.delete(imgCache.keys().next().value)}return imgCache.get(url)}
let pair,frame=0,timer=null,serial=0,change=0;
function halt(){clearInterval(timer);timer=null;$('play').textContent='재생'}
function setGroup(type,preferred){halt();let subset=pairs.filter(p=>type==='all'||group(p)===type);$('starts').replaceChildren(...subset.map(p=>new Option(p[0].start_id+'  ·  '+types[group(p)],p[0].start_id)));for(const b of $('choices').children)b.setAttribute('aria-pressed',String(b.dataset.type===type));choose(subset.some(p=>p[0].start_id===preferred)?preferred:subset[0][0].start_id)}
async function choose(id){halt();const seq=++change;pair=pairs.find(p=>p[0].start_id===id);$('starts').value=id;frame=0;
if(!traces[id])await new Promise((ok,no)=>{const s=document.createElement('script');s.src='viewer/'+id+'.js';s.onload=ok;s.onerror=no;document.head.append(s)});if(change!==seq)return;
$('time').max=Math.max(...pair.map(r=>r.observations))-1;
$('totaldist').textContent='출발점에서 관측점까지 '+pair[0].start_geo_m.toFixed(2)+' m';
$('links').replaceChildren(...pair.map((r,j)=>{const p=document.createElement('p');const a=document.createElement('a');a.href=dirs(r)+'last.png';a.target='_blank';a.textContent=names[j]+' 마지막 원본 사진';p.append(a);return p}));await draw()}
function action(a){return !a?'강제 종료':a[2]?'STOP':a[0]>.01?(Math.abs(a[1])>.1?'전진·회전':'전진'):'회전'}
async function draw(){let tag=++serial,id=pair[0].start_id,ts=traces[id],tick=frame;if(!ts)return;$('time').value=tick;
let pictures=await Promise.all(pair.map((r,i)=>{let n=Math.min(tick,r.observations-1);return image(dirs(r)+'rgb-'+String(Math.floor(n/64)).padStart(2,'0')+'.jpg')}));let base=await image('viewer/castle.png');if(tag!==serial||pair[0].start_id!==id)return;
let map=$('map').getContext('2d');map.drawImage(base,0,0);function xy(v){return [v[0]*transform.scale+transform.offset[0],v[1]*transform.scale+transform.offset[1]]}
pair.forEach((r,i)=>{let n=Math.min(tick,r.observations-1),j=n%64,v=ts[i][n],end=n===r.observations-1;
$('cam'+i).getContext('2d').drawImage(pictures[i],(j%8)*192,Math.floor(j/8)*144,192,144,0,0,192,144);
$('state'+i).textContent=end?reason[r.reason]:action(v[3]);$('state'+i).className=end?(r.success?'good':'bad'):'';
$('stats'+i).textContent=(n*.25).toFixed(2)+' s ／ '+r.elapsed_s.toFixed(2)+' s　·　충돌 '+v[4]+'회';
$('out'+i).textContent=end?'관측점까지 '+r.final_geo_m.C.toFixed(2)+' m　·　'+(r.visible_ids.includes('C')?'C 확인':'C 미확인'):'';
map.strokeStyle=colors[i];map.lineWidth=3;map.setLineDash(i?[6,3]:[]);map.beginPath();ts[i].slice(0,n+1).forEach((p,k)=>k?map.lineTo(...xy(p)):map.moveTo(...xy(p)));map.stroke();map.setLineDash([]);const [x,y]=xy(v);map.save();map.translate(x,y);map.rotate(-v[2]);map.beginPath();map.moveTo(0,-9);map.lineTo(-5,5);map.lineTo(5,5);map.closePath();map.fillStyle=colors[i];map.fill();map.restore()})}
for(const i of [0,1]){$('compare').insertAdjacentHTML('beforeend','<div class="card"><div class="hd"><h2>'+names[i]+'</h2><b id="state'+i+'"></b></div><canvas class="rgb" id="cam'+i+'" width="192" height="144"></canvas><div class="metrics" id="stats'+i+'"></div><div class="metrics" id="out'+i+'"></div></div>')}
$('totals').textContent=names.map((n,i)=>n+' 성공 '+summary.models[[1,4][i]].success+'/60').join('　　 ');
Object.entries(types).forEach(([k,label])=>{let n=k==='all'?60:summary.paired[k];const b=document.createElement('button');b.textContent=label+' '+n;b.dataset.type=k;b.disabled=!n;b.onclick=()=>setGroup(k);$('choices').append(b)});
function seek(v){halt();frame=Math.max(0,Math.min(Number($('time').max),v));draw()}
$('starts').onchange=()=>choose($('starts').value);$('time').oninput=()=>seek(+$('time').value);$('end').onclick=()=>seek(+$('time').max);$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);
$('play').onclick=()=>{if(timer)return halt();if(frame===+$('time').max)frame=0;$('play').textContent='일시정지';draw();timer=setInterval(()=>{if(frame>=+$('time').max)return halt();frame++;draw()},250/Number($('speed').value))};$('speed').onchange=()=>{if(timer){halt();$('play').click()}};setGroup('all',example);
</script></html>
